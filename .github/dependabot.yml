version: 2
updates:
  # one PR per ecosystem per cycle; monthly, not weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /cmd/parser/web
    schedule:
      interval: monthly
    groups:
      npm:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /deployments
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
