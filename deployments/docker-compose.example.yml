services:
  idolhub:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: idolhub
    env_file:
      - ../.env
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - PORT=${PORT:-8080}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./configs:/app/configs
      - app_data:/app/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8080}/api/config"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  app_data:
