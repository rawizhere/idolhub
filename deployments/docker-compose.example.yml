services:
  idolhub:
    image: rawizhere/idolhub:latest
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: idolhub
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - PORT=8080
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ../configs:/app/configs
      - app_data:/app/downloads
      - ../thumbnails:/app/thumbnails
    restart: unless-stopped
    depends_on:
      - camoufox
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/config"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# Real-browser engine for authenticated instagram requests. Point the instagram_sidecar_url setting at http://camoufox:9100 to use it.
  camoufox:
    build:
      context: ./camoufox
    container_name: camoufox
    environment:
      # must match the UA of the browser the instagram sessionid was created in
      - IG_USER_AGENT=${IG_USER_AGENT:-}
    volumes:
      - camoufox_profile:/data
    restart: unless-stopped
    # firefox + instagram pages spike well past 1.5g; an oom kill leaves the sidecar serving 502s until restart
    mem_limit: 3g

volumes:
  app_data:
  camoufox_profile:
