services:
  idolhub:
    image: rawizhere/idolhub:latest
    container_name: idolhub
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ../configs:/app/configs
      - ../downloads:/app/downloads
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - PORT=8080
      # PO-token provider for YouTube downloads; runs in the gemfactory stack
      - BGUTIL_POT_URL=${BGUTIL_POT_URL:-}
    networks:
      - default
      - gemfactory

networks:
  gemfactory:
    external: true
    name: gemfactory_gemfactory
