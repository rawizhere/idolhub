services:
  idolhub:
    image: rawizhere/idolhub:latest
    container_name: idolhub
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ../configs:/app/configs
      - ../downloads:/app/downloads
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/config"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
