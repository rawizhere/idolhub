services:
  idolhub:
    image: idolhub:local
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: idolhub
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ../configs:/app/configs
      - ../downloads:/app/downloads
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - PORT=8080
